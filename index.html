<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="autor" content="Ana Carolina">
    <link rel="stylesheet" href="style.css">
    <title>Gerador de Senha - Fácil</title>
</head>

<body>
    <div class="container">
        <h1>Gerador de <br><span>Senha Aleatória</span></h1>
        <div class="display">
            <input type="text" id="senha" placeholder="senha">
            <img src="img/copiar-arquivo.png" onclick="copySenha()">
        </div>
        <button onclick="createSenha()"><img src="img/image.png"> gerar senha</button>
    </div>

    <script>
        const senhaBox = document.getElementById("senha");
        const lenght = 12;

        const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowerCase = "abcdefghijklmnopqrstuvwxyz";
        const number = "0123456789";
        const symbol = "@#$%&*()_-+=~{}[]></|\^";

        const allChars = upperCase + lowerCase + number + symbol;

        function createSenha() {
            let senha = "";
            senha += upperCase[Math.floor(Math.random() * upperCase.length)];
            senha += lowerCase[Math.floor(Math.random() * lowerCase.length)];
            senha += number[Math.floor(Math.random() * number.length)];
            senha += symbol[Math.floor(Math.random() * symbol.length)];

            while (lenght > senha.length) {
                senha += allChars[Math.floor(Math.random() * allChars.length)];
            }
            senhaBox.value = senha; 

        }
        
        function copySenha() {
            senhaBox.select();
            document.execCommand("copiado");
        }

    </script>

</body>

</html>
