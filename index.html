<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="autor" content="Ana Carolina">
    <link rel="stylesheet" href="style.css">
    <title>Galeria de Fotos</title>
</head>

<body>

    <div class="galeria-wrap">
        <img src="img/seta-esquerda.png" id="voltarBtn">
        <div class="galeria">
            <div>
                <span><img src="img/kakashi.png" style="width: 310px;"></span>
                <span><img src="img/naruto.png"></span>
                <span><img src="img/neji.png"></span>
            </div>
            <div>
                <span><img src="img/sai.png" style="width: 299px;"></span>
                <span><img src="img/shikamaru.png"></span>
                <span><img src="img/shino.png"></span>
            </div>
        </div>
        <img src="img/jogar-seta.png" id="avancarBtn">
    </div>

    <script>
        let scrollContainer = document.querySelector(".galeria");
        let voltarBtn = document.getElementById("voltarBtn");
        let avancarBtn = document.getElementById("avancarBtn");

        scrollContainer.addEventListener("wheel", (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
            scrollContainer.style.scrollBehavior = "auto";
        });

        avancarBtn.addEventListener("click", () => {
            scrollContainer.style.scrollBehavior = "smooth";
            scrollContainer.scrollLeft += 900;
        });
        voltarBtn.addEventListener("click", () => {
            scrollContainer.style.scrollBehavior = "smooth";
            scrollContainer.scrollLeft -= 900;
        });

    </script>

</body>
